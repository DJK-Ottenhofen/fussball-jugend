<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 220" role="img">
  <title>Feldskizze Ballannahme in Spielform: Feld 30 mal 20 Meter mit je zwei Minitoren an den Stirnseiten, vier gegen vier, Spieler 1 passt zu Spieler 2, der den Ball in der Bewegung Richtung oberem rechtem Minitor mitnimmt</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="220" fill="#2E7D32"/>
  <!-- Feld 30 x 20 m -->
  <rect x="0" y="0" width="300" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Minitore, je 2 m breit, zwei pro Stirnseite -->
  <rect x="-4" y="40" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="-4" y="140" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="300" y="40" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="300" y="140" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Eckhütchen -->
  <g fill="#F28C28">
    <polygon points="8,6 12,14 4,14"/><polygon points="292,6 296,14 288,14"/>
    <polygon points="8,186 12,194 4,194"/><polygon points="292,186 296,194 288,194"/>
  </g>
  <!-- Wege -->
  <path d="M112,96 L138,64" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M160,52 Q195,42 228,46" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Team B, verteidigt die rechten Tore -->
  <g fill="#111" stroke="#fff" stroke-width="1.5">
    <circle cx="200" cy="90" r="7"/><circle cx="236" cy="82" r="7"/><circle cx="215" cy="140" r="7"/><circle cx="262" cy="110" r="7"/>
  </g>
  <!-- Team A, greift nach rechts an -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="100" cy="105" r="7"/><circle cx="148" cy="58" r="7"/><circle cx="95" cy="160" r="7"/><circle cx="55" cy="75" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="100" y="108.2">1</text><text x="148" y="61.2">2</text><text x="95" y="163.2">3</text><text x="55" y="78.2">4</text>
  </g>
  <!-- Ball -->
  <circle cx="108" cy="110" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
