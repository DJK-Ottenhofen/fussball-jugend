<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 270 220" role="img">
  <title>Feldskizze Abstoß-Aufbau: Feld 25 mal 20 Meter, links großes Tor mit Torhüter, rechts zwei Minitore, zwei Außenkinder an den Seitenlinien und ein Mittelkind, der Torhüter spielt flach zu einem Außenkind, Torhüter gelb mit dickem weißem Rand, zwei Verteidiger warten</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="270" height="220" fill="#2E7D32"/>
  <!-- Feld 25 x 20 m -->
  <rect x="0" y="0" width="250" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Kleinfeldtor 5 m links -->
  <rect x="-7" y="75" width="7" height="50" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Minitore rechts -->
  <rect x="250" y="70" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="250" y="110" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Hütchen: Außenpositionen 6 m vom Tor -->
  <g fill="#F28C28">
    <polygon points="46,10 50,18 42,18"/><polygon points="46,182 50,190 42,190"/>
  </g>
  <!-- Wege -->
  <path d="M40,96 L54,24" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5"><circle cx="60" cy="14" r="7"/><circle cx="60" cy="186" r="7"/><circle cx="24" cy="128" r="7"/></g>
  <g fill="#111" stroke="#fff" stroke-width="1.5"><circle cx="130" cy="70" r="7"/><circle cx="130" cy="130" r="7"/></g>
  <circle cx="12" cy="100" r="7" fill="#FFF300" stroke="#fff" stroke-width="3"/>
  <!-- Ball -->
  <circle cx="34" cy="100" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
