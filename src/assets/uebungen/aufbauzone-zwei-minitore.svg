<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 270 270" role="img">
  <title>Feldskizze Aufbau aus der Zone: Feld 25 mal 25 Meter, je zwei Minitore links und rechts, davor je eine 5 Meter tiefe Zone, ein gelber Spieler passt von der Mitte der Grundlinie zu einem Mitspieler in der eigenen Zone, Schwarz steht außerhalb</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="270" height="270" fill="#2E7D32"/>
  <!-- Feld 25 x 25 m -->
  <rect x="0" y="0" width="250" height="250" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Zonen 5 m vor jeder Grundlinie -->
  <rect x="0" y="0" width="50" height="250" fill="#fff" fill-opacity=".12"/>
  <rect x="200" y="0" width="50" height="250" fill="#fff" fill-opacity=".12"/>
  <!-- Minitore -->
  <g fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2">
    <rect x="-4" y="55" width="4" height="20"/><rect x="-4" y="175" width="4" height="20"/>
    <rect x="250" y="55" width="4" height="20"/><rect x="250" y="175" width="4" height="20"/>
  </g>
  <!-- Hütchen: Ecken und Zonengrenzen -->
  <g fill="#F28C28">
    <polygon points="0,-4 4,4 -4,4"/><polygon points="250,-4 254,4 246,4"/><polygon points="0,246 4,254 -4,254"/><polygon points="250,246 254,254 246,254"/>
    <polygon points="50,-4 54,4 46,4"/><polygon points="200,-4 204,4 196,4"/><polygon points="50,246 54,254 46,254"/><polygon points="200,246 204,254 196,254"/>
  </g>
  <!-- Wege: erster Pass in die eigene Zone -->
  <path d="M18,116 L32,57" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <!-- Spieler Gelb, baut von links auf -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="8" cy="125" r="7"/><circle cx="34" cy="45" r="7"/><circle cx="34" cy="205" r="7"/><circle cx="115" cy="95" r="7"/><circle cx="150" cy="175" r="7"/>
  </g>
  <!-- Spieler Schwarz, außerhalb der gelben Zone -->
  <g fill="#111" stroke="#fff" stroke-width="1.5">
    <circle cx="80" cy="65" r="7"/><circle cx="80" cy="190" r="7"/><circle cx="135" cy="135" r="7"/><circle cx="175" cy="80" r="7"/><circle cx="225" cy="150" r="7"/>
  </g>
  <!-- Ball -->
  <circle cx="17" cy="124" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
