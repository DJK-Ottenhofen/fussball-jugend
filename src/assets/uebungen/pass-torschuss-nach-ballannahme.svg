<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 170 220" role="img">
  <title>Feldskizze Pass und Torschuss: Tor oben, Passgeber links flach zum Schützen in der Mitte, der ihm entgegenläuft und aufs Tor schießt, zwei Wartende hinter dem Schützen, drei Hütchen am rechten Rand</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="170" height="220" fill="#2E7D32"/>
  <!-- Feld 15 x 20 m -->
  <rect x="0" y="0" width="150" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Tor 5 m -->
  <rect x="50" y="-7" width="50" height="7" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Hütchen für den Rückweg -->
  <g fill="#F28C28">
    <polygon points="130,56 134,64 126,64"/><polygon points="130,81 134,89 126,89"/><polygon points="130,106 134,114 126,114"/>
  </g>
  <!-- Wege -->
  <path d="M32,106 L62,123" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M77,141 L67,128" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M68,118 L75,14" fill="none" stroke="#fff" stroke-width="2.5" marker-end="url(#pfeil-weiss)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="24" cy="100" r="7"/><circle cx="80" cy="150" r="7"/><circle cx="60" cy="176" r="7"/><circle cx="100" cy="176" r="7"/>
  </g>
  <!-- Bälle -->
  <g fill="#fff" stroke="#111" stroke-width="1">
    <circle cx="33" cy="108" r="3"/><circle cx="67" cy="182" r="3"/><circle cx="107" cy="182" r="3"/>
  </g>
</svg>
