<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 270 220" role="img">
  <title>Feldskizze Teamfarbe: Feld 25 mal 20 Meter mit vier Hütchenzonen in der Mitte der Seiten, sechs Kinder mit je einem Ball, ein Kind dribbelt zur rechten Zone</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="270" height="220" fill="#2E7D32"/>
  <!-- Feld 25 x 20 m -->
  <rect x="0" y="0" width="250" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Vier Farbzonen 4 x 4 m: oben, unten, links, rechts -->
  <g fill="#fff" fill-opacity=".12">
    <rect x="105" y="10" width="40" height="40"/><rect x="105" y="150" width="40" height="40"/>
    <rect x="10" y="80" width="40" height="40"/><rect x="200" y="80" width="40" height="40"/>
  </g>
  <!-- Hütchen an den Zonenecken -->
  <g fill="#F28C28">
    <polygon points="105,6 109,14 101,14"/><polygon points="145,6 149,14 141,14"/><polygon points="105,46 109,54 101,54"/><polygon points="145,46 149,54 141,54"/>
    <polygon points="105,146 109,154 101,154"/><polygon points="145,146 149,154 141,154"/><polygon points="105,186 109,194 101,194"/><polygon points="145,186 149,194 141,194"/>
    <polygon points="10,76 14,84 6,84"/><polygon points="50,76 54,84 46,84"/><polygon points="10,116 14,124 6,124"/><polygon points="50,116 54,124 46,124"/>
    <polygon points="200,76 204,84 196,84"/><polygon points="240,76 244,84 236,84"/><polygon points="200,116 204,124 196,124"/><polygon points="240,116 244,124 236,124"/>
  </g>
  <!-- Weg: Dribbling zur gerufenen Zone rechts -->
  <path d="M110,100 q8,-6 16,0 t16,0 t16,0 t16,0" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Kinder, jedes mit Ball -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="90" cy="100" r="7"/><circle cx="60" cy="40" r="7"/><circle cx="165" cy="60" r="7"/>
    <circle cx="70" cy="150" r="7"/><circle cx="180" cy="160" r="7"/><circle cx="215" cy="35" r="7"/>
  </g>
  <g fill="#fff" stroke="#111" stroke-width="1">
    <circle cx="99" cy="103" r="3"/><circle cx="69" cy="43" r="3"/><circle cx="174" cy="63" r="3"/>
    <circle cx="79" cy="153" r="3"/><circle cx="189" cy="163" r="3"/><circle cx="224" cy="38" r="3"/>
  </g>
</svg>
