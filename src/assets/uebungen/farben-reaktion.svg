<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 220" role="img">
  <title>Feldskizze Farben-Reaktion: Feld 30 mal 20 Meter, in jeder Ecke drei Hütchen, vier Kinder starten aus der Mitte, zwei laufen zu gegenüberliegenden Ecken</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="220" fill="#2E7D32"/>
  <!-- Feld 30 x 20 m -->
  <rect x="0" y="0" width="300" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Hütchengruppen in den Ecken -->
  <g fill="#F28C28">
    <polygon points="10,6 14,14 6,14"/><polygon points="24,6 28,14 20,14"/><polygon points="10,20 14,28 6,28"/><polygon points="290,6 294,14 286,14"/><polygon points="276,6 280,14 272,14"/><polygon points="290,20 294,28 286,28"/><polygon points="10,186 14,194 6,194"/><polygon points="24,186 28,194 20,194"/><polygon points="10,172 14,180 6,180"/><polygon points="290,186 294,194 286,194"/><polygon points="276,186 280,194 272,194"/><polygon points="290,172 294,180 286,180"/>
  </g>
  <!-- Wege zu zwei Ecken -->
  <path d="M176,88 L268,30" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M124,112 L32,168" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Kinder in der Mitte -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="130" cy="108" r="7"/><circle cx="150" cy="115" r="7"/><circle cx="170" cy="92" r="7"/><circle cx="150" cy="88" r="7"/>
  </g>
</svg>
