<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 160 110" role="img">
  <title>Feldskizze Druckpass zu zweit: zwei Bahnen mit je zwei Hütchen im Abstand von 10 Metern, in der oberen Bahn dribbelt A zur Mitte, kappt zur Seite ab und spielt den Druckpass zu B</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="160" height="110" fill="#2E7D32"/>
  <!-- Kein Feld: zwei Bahnen, Hütchen 10 m auseinander -->
  <g fill="#F28C28">
    <polygon points="20,26 24,34 16,34"/><polygon points="120,26 124,34 116,34"/>
    <polygon points="20,76 24,84 16,84"/><polygon points="120,76 124,84 116,84"/>
  </g>
  <!-- Wege: Dribbling bis zur Mitte, Abkappen zur Seite, Druckpass -->
  <path d="M18,20 q 8,-6 16,0 t 16,0 t 16,0 q 8,5 5,-10" fill="none" stroke="#FFF300" stroke-width="2.5"/>
  <path d="M76,8 L118,17" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="8" cy="20" r="7"/><circle cx="130" cy="20" r="7"/>
    <circle cx="8" cy="70" r="7"/><circle cx="130" cy="70" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="8" y="23.2">A</text><text x="130" y="23.2">B</text><text x="8" y="73.2">A</text><text x="130" y="73.2">B</text>
  </g>
  <!-- Bälle -->
  <circle cx="72" cy="7" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  <circle cx="18" cy="68" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
