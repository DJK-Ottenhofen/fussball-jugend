<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 140" role="img">
  <title>Feldskizze Leiter-Parcours: zwei parallele Bahnen von 20 Metern, jede mit Koordinationsleiter, vier Hütchen im Slalom und Minitor am Ende, in Bahn 1 läuft ein Kind durch die Leiter, dribbelt den Slalom und schießt aufs Tor, in Bahn 2 startet ein zweites Kind, zwei weitere warten mit Ball</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="220" height="140" fill="#2E7D32"/>
  <!-- Feld 20 x 12 m, zwei Bahnen -->
  <rect x="0" y="0" width="200" height="120" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Bahn bei y=30: Leiter, Slalomhütchen, Tor -->
  <rect x="10" y="20" width="40" height="20" fill="none" stroke="#fff" stroke-width="1.5"/>
  <g stroke="#fff" stroke-width="1.5"><line x1="15" y1="20" x2="15" y2="40"/><line x1="20" y1="20" x2="20" y2="40"/><line x1="25" y1="20" x2="25" y2="40"/><line x1="30" y1="20" x2="30" y2="40"/><line x1="35" y1="20" x2="35" y2="40"/><line x1="40" y1="20" x2="40" y2="40"/><line x1="45" y1="20" x2="45" y2="40"/></g>
  <g fill="#F28C28">
    <polygon points="75,32 79,40 71,40"/><polygon points="95,20 99,28 91,28"/><polygon points="115,32 119,40 111,40"/><polygon points="135,20 139,28 131,28"/>
  </g>
  <rect x="200" y="20" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Bahn bei y=90: Leiter, Slalomhütchen, Tor -->
  <rect x="10" y="80" width="40" height="20" fill="none" stroke="#fff" stroke-width="1.5"/>
  <g stroke="#fff" stroke-width="1.5"><line x1="15" y1="80" x2="15" y2="100"/><line x1="20" y1="80" x2="20" y2="100"/><line x1="25" y1="80" x2="25" y2="100"/><line x1="30" y1="80" x2="30" y2="100"/><line x1="35" y1="80" x2="35" y2="100"/><line x1="40" y1="80" x2="40" y2="100"/><line x1="45" y1="80" x2="45" y2="100"/></g>
  <g fill="#F28C28">
    <polygon points="75,92 79,100 71,100"/><polygon points="95,80 99,88 91,88"/><polygon points="115,92 119,100 111,100"/><polygon points="135,80 139,88 131,88"/>
  </g>
  <rect x="200" y="80" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Wege Bahn 1: Leiter, Slalom, Schuss -->
  <path d="M32,30 L56,30" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M68,30 Q75,22 85,30 Q95,38 105,30 Q115,22 125,30 Q135,38 142,30" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M158,30 L194,30" fill="none" stroke="#fff" stroke-width="2.5" marker-end="url(#pfeil-weiss)"/>
  <!-- Spieler: je einer auf der Leiter, zwei warten mit Ball -->
  <g>
    <circle cx="22" cy="30" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="22" cy="90" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="14" cy="52" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="14" cy="68" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
  </g>
  <!-- Bälle: Ball hinter der Leiter, Wartende mit Ball -->
  <g>
    <circle cx="62" cy="30" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
    <circle cx="62" cy="90" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
    <circle cx="22" cy="56" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
    <circle cx="22" cy="72" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  </g>
</svg>
