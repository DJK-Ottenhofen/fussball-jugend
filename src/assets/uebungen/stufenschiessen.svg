<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 320" role="img">
  <title>Feldskizze Stufenschießen: großes Tor mit Torhüter, vier Stufen in 12, 16, 20 und 24 Metern, jeweils fünf Meter davor eine Hütchenreihe als Kette, ein Spieler schießt von Stufe 2 hoch ins Tor</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="320" fill="#2E7D32"/>
  <!-- Torlinie und Strafraum-Andeutung -->
  <line x1="0" y1="0" x2="300" y2="0" stroke="#fff" stroke-width="1.5"/>
  <rect x="75" y="0" width="150" height="90" fill="none" stroke="#fff" stroke-width="1.2" opacity=".6"/>
  <!-- Tor 5 m -->
  <rect x="125" y="-7" width="50" height="7" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Stufen: Linien in 12/16/20/24 m mit Eckhütchen -->
  <g stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="110" y1="120" x2="190" y2="120"/><line x1="110" y1="160" x2="190" y2="160"/>
    <line x1="110" y1="200" x2="190" y2="200"/><line x1="110" y1="240" x2="190" y2="240"/>
  </g>
  <g fill="#F28C28">
    <polygon points="110,115 114,123 106,123"/><polygon points="190,115 194,123 186,123"/>
    <polygon points="110,155 114,163 106,163"/><polygon points="190,155 194,163 186,163"/>
    <polygon points="110,195 114,203 106,203"/><polygon points="190,195 194,203 186,203"/>
    <polygon points="110,235 114,243 106,243"/><polygon points="190,235 194,243 186,243"/>
  </g>
  <!-- Ketten: Hütchenreihen 5 m vor jeder Stufe -->
  <g fill="#F28C28" opacity=".75">
    <polygon points="130,67 133,73 127,73"/><polygon points="150,67 153,73 147,73"/><polygon points="170,67 173,73 167,73"/>
    <polygon points="130,107 133,113 127,113"/><polygon points="150,107 153,113 147,113"/><polygon points="170,107 173,113 167,113"/>
    <polygon points="130,147 133,153 127,153"/><polygon points="150,147 153,153 147,153"/><polygon points="170,147 173,153 167,153"/>
    <polygon points="130,187 133,193 127,193"/><polygon points="150,187 153,193 147,193"/><polygon points="170,187 173,193 167,193"/>
  </g>
  <!-- Flugball von Stufe 2 -->
  <path d="M150,154 Q118,70 146,6" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <!-- Torhüter -->
  <circle cx="150" cy="8" r="7" fill="#111" stroke="#fff" stroke-width="3"/>
  <!-- Schützen auf den Stufen -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="150" cy="166" r="7"/>
    <circle cx="214" cy="126" r="7"/><circle cx="214" cy="166" r="7"/>
    <circle cx="86" cy="206" r="7"/><circle cx="214" cy="246" r="7"/>
  </g>
  <circle cx="150" cy="158" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
