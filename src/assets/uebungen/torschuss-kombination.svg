<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 260 300" role="img">
  <title>Feldskizze Torschuss-Kombination: Tor mit Torhüter oben, Schusslinie 14 Meter vor dem Tor, links passt Spieler 1 vom Start zu Spieler 2 an der Wand, läuft in den Raum, bekommt den Ball zurück und schießt, rechts ist die gespiegelte Bahn aufgebaut</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="260" height="300" fill="#2E7D32"/>
  <!-- Feld 24 x 28 m -->
  <rect x="0" y="0" width="240" height="280" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Schussbereich vor dem Tor -->
  <rect x="0" y="0" width="240" height="140" fill="#fff" fill-opacity=".12"/>
  <!-- Tor 5 m -->
  <rect x="95" y="-7" width="50" height="7" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Schusslinie 14 m vor dem Tor -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Hütchen: Schusslinie, Start- und Wandpositionen -->
  <g fill="#F28C28">
    <polygon points="20,135 24,143 16,143"/><polygon points="220,135 224,143 216,143"/>
    <polygon points="40,243 44,251 36,251"/><polygon points="200,243 204,251 196,251"/>
    <polygon points="20,148 24,156 16,156"/><polygon points="220,148 224,156 216,156"/>
  </g>
  <!-- Wege -->
  <path d="M57,232 L43,162" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M68,232 Q86,190 98,132" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M48,144 Q70,140 90,136" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M104,120 L138,10" fill="none" stroke="#fff" stroke-width="2.5" marker-end="url(#pfeil-weiss)"/>
  <!-- Torhüter -->
  <circle cx="112" cy="10" r="7" fill="#111" stroke="#fff" stroke-width="3"/>
  <!-- Spieler: linke Bahn mit Nummern -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="60" cy="240" r="7"/><circle cx="40" cy="150" r="7"/><circle cx="60" cy="262" r="7"/>
    <circle cx="180" cy="240" r="7"/><circle cx="200" cy="150" r="7"/><circle cx="180" cy="262" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="60" y="243.2">1</text><text x="40" y="153.2">2</text>
  </g>
  <!-- Bälle -->
  <circle cx="70" cy="244" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  <circle cx="190" cy="244" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
