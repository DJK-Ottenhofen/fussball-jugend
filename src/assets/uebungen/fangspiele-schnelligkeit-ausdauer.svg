<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" role="img">
  <title>Feldskizze Fangspiele Grundform: Quadrat 20 mal 20 Meter mit vier Eckhütchen, sechs Läufer und zwei Fänger mit gelbem Ring, ein Fänger jagt einen Läufer, der ihm davonläuft</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="220" height="220" fill="#2E7D32"/>
  <!-- Grundform 20 x 20 m -->
  <rect x="0" y="0" width="200" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Eckhütchen -->
  <g fill="#F28C28">
    <polygon points="0,-4 4,4 -4,4"/><polygon points="200,-4 204,4 196,4"/><polygon points="0,196 4,204 -4,204"/><polygon points="200,196 204,204 196,204"/>
  </g>
  <!-- Wege -->
  <path d="M52,64 L92,92" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil-schwarz)"/>
  <path d="M118,98 Q142,92 146,72" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Läufer Team A -->
  <g>
    <circle cx="105" cy="100" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="160" cy="50" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="40" cy="150" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="150" cy="170" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="70" cy="25" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
    <circle cx="175" cy="120" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
  </g>
  <!-- Fänger Team B mit gelbem Ring -->
  <g>
    <circle cx="40" cy="50" r="7" fill="#111" stroke="#fff" stroke-width="1.5"/><circle cx="40" cy="50" r="10" fill="none" stroke="#FFF300" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="7" fill="#111" stroke="#fff" stroke-width="1.5"/><circle cx="140" cy="140" r="10" fill="none" stroke="#FFF300" stroke-width="1.5"/>
  </g>
</svg>
