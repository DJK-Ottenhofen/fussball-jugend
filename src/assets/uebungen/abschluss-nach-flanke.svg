<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 420" role="img">
  <title>Feldskizze Abschluss nach Flanke: Ausschnitt 30 mal 40 Meter, oben großes Tor mit Torhüter und Strafraum, Flügelspieler rechts schlägt einen Flugball, zwei Angreifer laufen zum nahen Pfosten und in den Rückraum ein</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="420" fill="#2E7D32"/>
  <!-- Feld 30 x 40 m -->
  <rect x="0" y="0" width="300" height="400" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Strafraum 22 x 13 m -->
  <rect x="40" y="0" width="220" height="130" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Hütchen an den Strafraumecken -->
  <g fill="#F28C28">
    <polygon points="40,126 44,134 36,134"/><polygon points="260,126 264,134 256,134"/>
  </g>
  <!-- Tor -->
  <rect x="125" y="-7" width="50" height="7" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Wege -->
  <path d="M266,200 Q230,20 188,50" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M130,148 Q136,90 166,44" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M170,172 Q158,150 152,128" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Torhüter -->
  <circle cx="150" cy="10" r="7" fill="#111" stroke="#fff" stroke-width="3"/>
  <!-- Angreifer -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="276" cy="210" r="7"/><circle cx="130" cy="148" r="7"/><circle cx="170" cy="172" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="276" y="213.2">1</text><text x="130" y="151.2">2</text><text x="170" y="175.2">3</text>
  </g>
  <!-- Ball -->
  <circle cx="268" cy="204" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
