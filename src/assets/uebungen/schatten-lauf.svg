<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 270 220" role="img">
  <title>Feldskizze Schattenlauf: Feld 25 mal 20 Meter, zwei Paare, jeweils dribbelt ein Kind mit Ball und das zweite Kind läuft als Schatten drei Meter seitlich versetzt mit</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="270" height="220" fill="#2E7D32"/>
  <!-- Feld 25 x 20 m -->
  <rect x="0" y="0" width="250" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Hütchen -->
  <g fill="#F28C28">
    <polygon points="0,-4 4,4 -4,4"/><polygon points="250,-4 254,4 246,4"/><polygon points="0,196 4,204 -4,204"/><polygon points="250,196 254,204 246,204"/>
  </g>
  <!-- Wege Paar 1 -->
  <path d="M30,60 q 8,-6 16,0 t 16,0 t 16,0 t 16,0 t 16,0" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M34,92 L126,92" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil-schwarz)"/>
  <!-- Wege Paar 2 -->
  <path d="M130,150 q 8,-6 16,0 t 16,0 t 16,0 t 16,0" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M134,182 L204,182" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil-schwarz)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5"><circle cx="116" cy="60" r="7"/><circle cx="196" cy="150" r="7"/></g>
  <g fill="#111" stroke="#fff" stroke-width="1.5"><circle cx="140" cy="92" r="7"/><circle cx="216" cy="182" r="7"/></g>
  <!-- Bälle -->
  <circle cx="126" cy="66" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  <circle cx="206" cy="156" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
