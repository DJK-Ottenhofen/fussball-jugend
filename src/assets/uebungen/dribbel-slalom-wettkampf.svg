<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 120" role="img">
  <title>Feldskizze Dribbel-Slalom: zwei Bahnen mit je fünf Hütchen, Start links, Ziel rechts, in jeder Bahn dribbelt ein Kind in Schlangenlinien um die Hütchen</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="220" height="120" fill="#2E7D32"/>
  <!-- Feld 20 x 10 m -->
  <rect x="0" y="0" width="200" height="100" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Bahnen 4 m breit, 2 m Abstand -->
  <rect x="0" y="0" width="200" height="40" fill="#fff" fill-opacity=".12"/>
  <rect x="0" y="60" width="200" height="40" fill="#fff" fill-opacity=".12"/>
  <!-- Start- und Ziellinie -->
  <line x1="0" y1="0" x2="0" y2="100" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <line x1="200" y1="0" x2="200" y2="100" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Hütchen, Abstand 4 m -->
  <g fill="#F28C28">
    <polygon points="20,16 24,24 16,24"/><polygon points="60,16 64,24 56,24"/><polygon points="100,16 104,24 96,24"/><polygon points="140,16 144,24 136,24"/><polygon points="180,16 184,24 176,24"/>
    <polygon points="20,76 24,84 16,84"/><polygon points="60,76 64,84 56,84"/><polygon points="100,76 104,84 96,84"/><polygon points="140,76 144,84 136,84"/><polygon points="180,76 184,84 176,84"/>
  </g>
  <!-- Dribbling -->
  <path d="M50,22 Q62,0 80,20 T120,20 T160,20 T198,20" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M50,82 Q62,60 80,80 T120,80 T160,80 T198,80" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil-schwarz)"/>
  <!-- Spieler -->
  <circle cx="40" cy="20" r="7" fill="#FFF300" stroke="#111" stroke-width="1.5"/>
  <circle cx="40" cy="80" r="7" fill="#111" stroke="#fff" stroke-width="1.5"/>
  <!-- Bälle -->
  <circle cx="52" cy="27" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  <circle cx="52" cy="87" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
