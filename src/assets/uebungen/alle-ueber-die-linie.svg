<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 220" role="img">
  <title>Feldskizze Alle über die Linie: Feld 30 mal 20 Meter mit Mittellinie und je zwei Minitoren pro Grundlinie, alle vier Angreifer stehen in der gegnerischen Hälfte, vier Verteidiger davor, Spieler 3 schießt auf ein Minitor</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="220" fill="#2E7D32"/>
  <!-- Feld 30 x 20 m -->
  <rect x="0" y="0" width="300" height="200" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Mittellinie -->
  <line x1="150" y1="0" x2="150" y2="200" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Minitore an den Grundlinien -->
  <rect x="-4" y="60" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="-4" y="120" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="300" y="60" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <rect x="300" y="120" width="4" height="20" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2"/>
  <!-- Wege -->
  <path d="M222,52 L196,92" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M170,160 L206,140" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M232,150 L290,132" fill="none" stroke="#fff" stroke-width="2.5" marker-end="url(#pfeil-weiss)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5"><circle cx="190" cy="100" r="7"/><circle cx="222" cy="45" r="7"/><circle cx="238" cy="152" r="7"/><circle cx="165" cy="165" r="7"/></g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle"><text x="190" y="103.2">1</text><text x="222" y="48.2">2</text><text x="238" y="155.2">3</text><text x="165" y="168.2">4</text></g>
  <g fill="#111" stroke="#fff" stroke-width="1.5"><circle cx="255" cy="110" r="7"/><circle cx="200" cy="60" r="7"/><circle cx="245" cy="85" r="7"/><circle cx="265" cy="60" r="7"/></g>
  <!-- Ball -->
  <circle cx="246" cy="156" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
