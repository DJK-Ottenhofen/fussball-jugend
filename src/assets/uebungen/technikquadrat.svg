<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" role="img">
  <title>Feldskizze Technikquadrat: Quadrat von 10 mal 10 Meter mit Hütchen in den Ecken, in jeder Ecke ein Kind, Pass oben von links nach rechts mit Nachlaufen</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="120" height="120" fill="#2E7D32"/>
  <!-- Quadrat 10 x 10 m -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Eckhütchen -->
  <g fill="#F28C28">
    <polygon points="0,-4 4,4 -4,4"/><polygon points="100,-4 104,4 96,4"/><polygon points="0,96 4,104 -4,104"/><polygon points="100,96 104,104 96,104"/>
  </g>
  <!-- Wege -->
  <path d="M34,15 L72,15" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M20,32 L70,32" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="14" cy="14" r="7"/><circle cx="86" cy="14" r="7"/><circle cx="86" cy="86" r="7"/><circle cx="14" cy="86" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="14" y="17.2">1</text><text x="86" y="17.2">2</text><text x="86" y="89.2">3</text><text x="14" y="89.2">4</text>
  </g>
  <!-- Bälle -->
  <circle cx="26" cy="15" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  <circle cx="74" cy="88" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
