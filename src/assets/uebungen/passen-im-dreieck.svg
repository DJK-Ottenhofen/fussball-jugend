<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 140" role="img">
  <title>Feldskizze Passen im Dreieck: zwei Dreiecke mit 10 Metern Seitenlänge, im linken passt Spieler 1 zu Spieler 2 und tauscht dabei den Platz mit Spieler 3, im rechten Dreieck stehen drei Spieler bereit</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="140" fill="#2E7D32"/>
  <!-- Feld 30 x 12 m -->
  <rect x="0" y="0" width="300" height="120" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Dreiecke, Seitenlänge 10 m -->
  <path d="M35,98 L85,11.4 L135,98 z" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <path d="M185,98 L235,11.4 L285,98 z" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Hütchen an den Ecken -->
  <g fill="#F28C28">
    <polygon points="35,93 39,101 31,101"/><polygon points="85,6.4 89,14.4 81,14.4"/><polygon points="135,93 139,101 131,101"/>
    <polygon points="185,93 189,101 181,101"/><polygon points="235,6.4 239,14.4 231,14.4"/><polygon points="285,93 289,101 281,101"/>
  </g>
  <!-- Wege -->
  <path d="M48,83 L80,30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M52,114 L114,114" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M118,106 L56,106" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Spieler -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="43" cy="92" r="7"/><circle cx="85" cy="21.4" r="7"/><circle cx="127" cy="92" r="7"/>
    <circle cx="193" cy="92" r="7"/><circle cx="235" cy="21.4" r="7"/><circle cx="277" cy="92" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="43" y="95.2">1</text><text x="85" y="24.6">2</text><text x="127" y="95.2">3</text>
  </g>
  <!-- Ball -->
  <circle cx="52" cy="88" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
  <circle cx="202" cy="88" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
