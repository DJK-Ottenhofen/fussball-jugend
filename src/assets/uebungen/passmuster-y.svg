<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 320" role="img">
  <title>Feldskizze Passmuster im Y: vier Hütchen als Y mit 15 Meter langen Schenkeln, Spieler 1 am Fuß passt zu Spieler 2 in der Mitte, der legt auf Spieler 3 am linken Arm ab, der in den Lauf von Spieler 1 diagonal zurückspielt</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="320" height="320" fill="#2E7D32"/>
  <!-- Feld 30 x 30 m -->
  <rect x="0" y="0" width="300" height="300" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Y-Linien: Schenkel zu je 15 m -->
  <g stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8" fill="none">
    <line x1="150" y1="280" x2="150" y2="130"/><line x1="150" y1="130" x2="44" y2="24"/><line x1="150" y1="130" x2="256" y2="24"/>
  </g>
  <!-- Hütchen -->
  <g fill="#F28C28">
    <polygon points="150,276 154,284 146,284"/><polygon points="150,126 154,134 146,134"/>
    <polygon points="44,20 48,28 40,28"/><polygon points="256,20 260,28 252,28"/>
  </g>
  <!-- Wege -->
  <path d="M150,272 L150,160" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M143,142 L56,56" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M60,36 L192,130" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M162,262 Q236,214 214,150" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <!-- Spieler mit Nummer -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="150" cy="294" r="7"/><circle cx="150" cy="146" r="7"/><circle cx="44" cy="42" r="7"/><circle cx="256" cy="42" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="150" y="297.2">1</text><text x="150" y="149.2">2</text><text x="44" y="45.2">3</text><text x="256" y="45.2">4</text>
  </g>
  <!-- Ball -->
  <circle cx="160" cy="288" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
