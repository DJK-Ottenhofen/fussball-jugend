<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 140" role="img">
  <title>Feldskizze 2-gegen-1: Langrechteck 20 mal 12 Meter mit einem Minitor rechts, zwei gelbe Angreifer spielen einen Pass und laufen aufs Tor, ein schwarzer Verteidiger steht vor dem Tor</title>
  <defs>
    <marker id="pfeil-weiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="pfeil-gelb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFF300"/></marker>
    <marker id="pfeil-schwarz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="-10" y="-10" width="220" height="140" fill="#2E7D32"/>
  <!-- Feld 20 x 12 m -->
  <rect x="0" y="0" width="200" height="120" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Umschaltlinie links -->
  <line x1="0" y1="0" x2="0" y2="120" stroke="#fff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
  <!-- Eckhütchen links -->
  <g fill="#F28C28">
    <polygon points="0,-4 4,4 -4,4"/><polygon points="0,116 4,124 -4,124"/>
    <!-- Minitor 2 m rechts -->
    <polygon points="200,46 204,54 196,54"/><polygon points="200,66 204,74 196,74"/>
    <polygon points="200,-4 204,4 196,4"/><polygon points="200,116 204,124 196,124"/>
  </g>
  <!-- Wege -->
  <path d="M67,43 L98,82" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-weiss)"/>
  <path d="M112,88 L142,76" fill="none" stroke="#FFF300" stroke-width="2.5" marker-end="url(#pfeil-gelb)"/>
  <path d="M166,72 L152,92" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil-schwarz)"/>
  <!-- Verteidiger -->
  <circle cx="172" cy="62" r="7" fill="#111" stroke="#fff" stroke-width="1.5"/>
  <!-- Angreifer -->
  <g fill="#FFF300" stroke="#111" stroke-width="1.5">
    <circle cx="52" cy="30" r="7"/><circle cx="104" cy="92" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">
    <text x="52" y="33.2">1</text><text x="104" y="95.2">2</text>
  </g>
  <text x="172" y="65.2" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <!-- Ball -->
  <circle cx="62" cy="38" r="3" fill="#fff" stroke="#111" stroke-width="1"/>
</svg>
